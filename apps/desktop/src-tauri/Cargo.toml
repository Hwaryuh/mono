[package]
name = "mono-desktop"
version.workspace = true
description = "A Workspace for Simple Productivity"
edition = "2021"
rust-version = "1.77.2"

# 데스크톱 전용 — 모바일(staticlib/cdylib) 크레이트 타입은 뺐다. 바이너리가 rlib만 링크한다.
# ponytail: 모바일 타깃 추가 시 tauri init이 crate-type을 다시 넣는다.
[lib]
name = "mono_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
url = "2"

# 자동 업데이트 — GitHub 릴리스의 latest.json을 fetch, 서명 검증 후 설치·재시작.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# API 서버는 별도 크레이트(crates/mono-api). lib.rs가 `mono_api::spawn`으로 임베드한다.
# standalone 바이너리는 그 크레이트의 [[bin]] — tauri 의존 없이 linux에서 빌드된다.
mono-api = { path = "../../../crates/mono-api" }

# profile.release는 워크스페이스 루트 Cargo.toml로 이동함.
