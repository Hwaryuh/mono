[package]
name = "mono-desktop"
version = "0.1.0"
description = "개인 관리 플랫폼 데스크톱 앱"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mono_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
