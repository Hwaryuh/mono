name: Deploy server

run-name: Deploy server ${{ inputs.release_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 릴리즈 커밋 SHA (main HEAD와 일치해야 함)
        required: false
        type: string
      ci_run_id:
        description: 이 배포를 요청한 ci.yml 런 ID (frontend·rust 통과 확인용)
        required: false
        type: string

permissions: {}

concurrency:
  group: mono-server-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Server deploys require main. Selected ref: $GITHUB_REF" >&2
          exit 1

      - name: Require requested release SHA
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$RELEASE_SHA" ]]; then
            echo "main moved: release requires $RELEASE_SHA, deployment resolved to $GITHUB_SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Require passing checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          # CI가 요청한 경우: 그 런의 frontend·rust 잡이 성공했는지 본다(bundle 등은 진행 중일 수 있음).
          if [[ -n "$CI_RUN_ID" ]]; then
            checks="$(
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs" \
                --jq '[.jobs[] | select(.name == "frontend" or .name == "rust") | .conclusion] | sort'
            )"
            if [[ "$checks" != '["success","success"]' ]]; then
              echo "CI run $CI_RUN_ID: frontend·rust 잡이 성공 상태가 아니다 ($checks)." >&2
              exit 1
            fi
          # 수동 실행: 이 SHA에 대해 성공한 ci.yml 런이 하나라도 있어야 한다.
          else
            successful_runs="$(
              gh api \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\")] | length"
            )"
            if [[ "$successful_runs" -lt 1 ]]; then
              echo "No successful CI run found for $GITHUB_SHA." >&2
              exit 1
            fi
          fi

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: v2-server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Linux server
        run: cargo test --locked -p mono-api

      - name: Build Linux x86_64 server
        run: cargo build --locked --release -p mono-api

      - name: Prepare deployment payload
        run: |
          install -d dist/systemd
          install -m 0755 target/release/mono-api dist/mono-api
          install -m 0644 deploy/systemd/mono-api.service dist/systemd/mono-api.service
          install -m 0644 deploy/systemd/mono-api-backup.service dist/systemd/mono-api-backup.service
          install -m 0644 deploy/systemd/mono-api-backup.timer dist/systemd/mono-api-backup.timer
          sha256sum dist/mono-api > dist/mono-api.sha256
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "mono-api") | .version' \
            > dist/VERSION
          test -s dist/VERSION

      - name: Retain deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-api-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: server-production
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: mono-api-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Connect runner to tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy
          # ping 입력은 ICMP/TSMP라 tcp:22만 여는 grant에서 거부될 수 있다.
          # 실제 도달성은 아래 SSH 프로브가 재시도로 확인한다.

      - name: Configure dedicated SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MONO_DEPLOY_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ vars.MONO_SERVER_HOST }}
          SERVER_HOST_KEY: ${{ vars.MONO_SERVER_SSH_HOST_KEY }}
          SERVER_USER: ${{ vars.MONO_SERVER_USER }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/mono-deploy"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/mono-deploy"
          printf '%s %s\n' "$SERVER_HOST" "$SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          {
            echo 'Host mono-server-deploy'
            echo "  HostName $SERVER_HOST"
            echo "  User $SERVER_USER"
            echo '  IdentityFile ~/.ssh/mono-deploy'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
            echo '  StrictHostKeyChecking yes'
            echo '  UserKnownHostsFile ~/.ssh/known_hosts'
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

      - name: Upload and deploy atomically
        run: |
          release_id="$GITHUB_SHA"
          binary_sha="$(cut -d ' ' -f 1 dist/mono-api.sha256)"
          remote_dir="/var/tmp/mono-deploy/$release_id"

          protocol_version=""
          for attempt in 1 2 3 4 5 6; do
            if protocol_version="$(ssh -o ConnectTimeout=10 mono-server-deploy sudo /usr/local/sbin/deploy-mono-api --protocol-version)"; then
              break
            fi
            echo "SSH probe attempt $attempt failed; retrying in 5s." >&2
            protocol_version=""
            sleep 5
          done
          if [[ "$protocol_version" != "1" ]]; then
            echo "Server deployment helper unreachable or unsupported protocol: '$protocol_version'" >&2
            exit 1
          fi

          ssh mono-server-deploy "install -d -m 0700 '$remote_dir/systemd'"
          scp dist/mono-api mono-server-deploy:"$remote_dir/mono-api"
          scp dist/systemd/mono-api.service mono-server-deploy:"$remote_dir/systemd/mono-api.service"
          scp dist/systemd/mono-api-backup.service mono-server-deploy:"$remote_dir/systemd/mono-api-backup.service"
          scp dist/systemd/mono-api-backup.timer mono-server-deploy:"$remote_dir/systemd/mono-api-backup.timer"
          ssh mono-server-deploy sudo /usr/local/sbin/deploy-mono-api "$release_id" "$binary_sha"

          expected_version="$(<dist/VERSION)"
          deployed_version="$(
            ssh mono-server-deploy \
              'curl --silent --show-error --fail --max-time 5 "http://$(tailscale ip -4):4174/version"' \
              | jq -er '.version'
          )"
          if [[ "$deployed_version" != "$expected_version" ]]; then
            echo "Server version mismatch after deploy: expected $expected_version, got $deployed_version" >&2
            exit 1
          fi
          echo "Server $deployed_version deployed and verified."
