name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 릴리즈 파이프라인(bundle·tag·publish)은 "chore(release): bump version" 커밋이
# main에 오르면 실행된다. 태그 push는 트리거가 아니다 — 태그는 tag-release 잡이 만든다.
# 이유: GitHub Actions 캐시는 ref 스코프다. 태그마다 새 스코프라 태그 트리거는
# bundle의 release-profile target/ 캐시를 매번 콜드로 만든다. main 트리거면 캐시가
# 재사용돼 dep 미변경 릴리즈의 번들 시간이 ~7분 → ~2분대로 떨어진다.

jobs:
  # 프론트 + 계약 패키지. Linux 러너 — 유닛 테스트는 플랫폼 무관, 요금 1x.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # API 서버 유닛 테스트 + 컴파일 검증. frontend와 병렬 — 벽시계는 둘 중 느린 쪽.
  # src-tauri 크레이트는 Linux GTK/webkit dev 패키지가 있어야 check되므로 여기서 제외한다.
  # 그 크레이트는 릴리즈의 bundle 잡이 windows·macOS에서 실제로 빌드한다.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: v2-rust-check
          # PR에서는 저장하지 않는다 — main만 캐시를 갱신해 10GB 한도 경쟁을 줄인다.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm run version:check
      - run: cargo test --locked -p mono-api

  # 전체 번들 — 릴리즈 커밋·수동 실행만. 일반 push에서는 안 돎(macOS 러너 분 아낌).
  # main 트리거라 rust-cache가 main 스코프에 저장·복원된다(태그 스코프 갇힘 문제 해소).
  bundle:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version')) }}"
    needs: [frontend, rust]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # release 프로필 target/. Cargo.lock의 dep 그래프가 안 바뀌면 dep 재컴파일 없이
          # 앱 크레이트(mono-desktop)만 다시 빌드된다.
          prefix-key: v2-bundle

      # macos-26은 공식 arm64 label → aarch64 .dmg. Intel Mac 대상은 별도 매트릭스 필요.
      # APPLE_SIGNING_IDENTITY: '-' → ad-hoc 서명. 없으면 arm64 미서명 앱이 "손상됨"으로
      # 안 뜬다. 정식 배포는 Developer ID + 공증(APPLE_ID/APPLE_TEAM_ID 시크릿).
      # TAURI_SIGNING_*: updater 아티팩트(.sig) 서명. 개인키는 repo secret, 비번은 없음(빈 문자열).
      # 공개키는 tauri.conf.json plugins.updater.pubkey — 앱이 이걸로 서명을 검증한다.
      - name: Tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri --workspace @mono/desktop -- build

      # 번들 하위 디렉터리(dmg/·macos/·nsis/)가 플랫폼마다 달라 아티팩트 구조가 어긋난다.
      # 원하는 파일만 평평한 staging/으로 모아 올린다 — 다운로드 후 글롭이 단순해진다.
      # .dmg = 신규 설치용. updater 타깃: darwin-aarch64 → .app.tar.gz, windows-x86_64 → -setup.exe.
      # .sig는 latest.json 서명에만 쓰고 릴리스에는 첨부하지 않는다.
      - name: Stage release files
        shell: bash
        run: |
          mkdir staging
          find target/release/bundle -type f \( \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
          \) -exec cp {} staging/ \;
          ls -la staging

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: mono-${{ matrix.os }}
          path: staging/
          if-no-files-found: error

  # 릴리즈 커밋(= 이 커밋)에 vX.Y.Z 태그를 만들어 push한다. 태그 push는 CI를 재트리거하지 않는다.
  tag-release:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        run: |
          version="$(node scripts/version.mjs print)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          tag="${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "태그 $tag 가 이미 있다 — 버전을 올리지 않은 릴리즈 커밋인가?" >&2
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

  publish-draft-release:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: [bundle, tag-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v7
        with:
          pattern: mono-*
          path: release-assets
          merge-multiple: true

      # tauri-plugin-updater가 조회하는 매니페스트. 플랫폼별 서명(.sig 내용) + 다운로드 URL을
      # 담는다. URL은 태그에 고정 — "latest" 플래그와 무관하게 항상 이 릴리스를 가리킨다.
      - name: Build latest.json
        env:
          VERSION: ${{ needs.tag-release.outputs.version }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.tag-release.outputs.tag }}
        run: |
          mac_archive="$(basename "$(ls release-assets/*.app.tar.gz)")"
          win_installer="$(basename "$(ls release-assets/*-setup.exe)")"
          mac_sig="$(cat release-assets/*.app.tar.gz.sig)"
          win_sig="$(cat release-assets/*-setup.exe.sig)"
          [[ -n "$mac_sig" && -n "$win_sig" ]] || { echo "서명 파일이 비어 있다 — TAURI_SIGNING_PRIVATE_KEY secret 확인." >&2; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$mac_sig" --arg mac_url "$BASE_URL/$mac_archive" \
            --arg win_sig "$win_sig" --arg win_url "$BASE_URL/$win_installer" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > release-assets/latest.json
          cat release-assets/latest.json

      - name: Attach desktop bundles to draft release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ needs.tag-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/latest.json

  verify-release-assets:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: publish-draft-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Draft 릴리스는 tag가 없어 GET /releases/tags/{tag}가 404다. attach step이
      # 보고한 asset 목록(newly uploaded/overwritten)을 그대로 검증한다.
      - name: Verify Windows and macOS release assets
        env:
          ASSETS_JSON: ${{ needs.publish-draft-release.outputs.assets }}
        run: |
          printf '%s\n' "$ASSETS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "publish-draft-release가 asset을 보고하지 않았다." >&2; exit 1; }
          names="$(printf '%s' "$ASSETS_JSON" | jq -r '.[].name')"
          printf '%s\n' "$names"

          windows_count="$(printf '%s\n' "$names" | grep -Ec -- '-setup\.exe$' || true)"
          macos_count="$(printf '%s\n' "$names" | grep -Ec -- '\.dmg$' || true)"
          mac_updater_count="$(printf '%s\n' "$names" | grep -Ec -- '\.app\.tar\.gz$' || true)"
          manifest_count="$(printf '%s\n' "$names" | grep -Ec -- '^latest\.json$' || true)"
          if [[ "$windows_count" -ne 1 || "$macos_count" -ne 1 || "$mac_updater_count" -ne 1 || "$manifest_count" -ne 1 ]]; then
            echo "Windows setup exe·macOS DMG·macOS .app.tar.gz·latest.json 각 1개를 기대했다." >&2
            exit 1
          fi

  # bundle과 병렬로 돈다 — 서버 배포는 커밋 SHA만 있으면 되고 번들 아티팩트와 무관하다.
  # 서버가 클라이언트보다 잠깐 앞서는 건 안전한 방향(앱은 서버가 뒤처질 때만 경고).
  # publish-release가 이 잡 완료를 기다리므로 "서버 배포·검증 후 클라이언트 공개" 순서는 유지된다.
  deploy-release-server:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
    steps:
      # 릴리즈 커밋 SHA를 trusted main ref에서 배포하도록 요청한다. deploy-server.yml이
      # main이 그 SHA에서 이동하지 않았는지, 그리고 이 CI 런의 frontend·rust가 통과했는지 확인한다.
      - name: Dispatch and wait for server deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_name="Deploy server $GITHUB_SHA"
          gh workflow run deploy-server.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$GITHUB_SHA" \
            -f ci_run_id="$GITHUB_RUN_ID"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow deploy-server.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,headSha,displayTitle,createdAt \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .displayTitle == \"$run_name\" and .createdAt >= \"$requested_at\") | .databaseId" \
                | head -n 1
            )"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Dispatched server deployment run was not found." >&2
            exit 1
          fi

          echo "Waiting for server deployment run $run_id."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

  publish-release:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: [verify-release-assets, deploy-release-server, tag-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune-old-releases:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release): bump version') }}"
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep latest five published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t stale_tags < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[5:] | .[].tagName'
          )

          for tag in "${stale_tags[@]}"; do
            [[ -n "$tag" ]] || continue
            echo "Deleting old release $tag; Git tag remains."
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
