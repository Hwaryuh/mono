name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 프론트 + 계약 패키지. Linux 러너 — 유닛 테스트는 플랫폼 무관, 요금 1x.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # API 서버 유닛 테스트 + 컴파일 검증. frontend와 병렬 — 벽시계는 둘 중 느린 쪽.
  # src-tauri 크레이트는 Linux GTK/webkit dev 패키지가 있어야 check되므로 여기서 제외한다.
  # 그 크레이트는 태그의 bundle 잡이 windows·macOS에서 실제로 빌드한다.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: v2-rust-check
          # PR에서는 저장하지 않는다 — main·태그만 캐시를 갱신해 10GB 한도 경쟁을 줄인다.
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - run: npm run version:check
      - run: cargo test --locked -p mono-api

  # 전체 번들 — v* 태그·수동 실행만. 일반 push에서는 안 돎(macOS 러너 분 아낌).
  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [frontend, rust]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # release 프로필 target/를 캐시한다. Cargo.lock이 안 바뀌면 dep 재컴파일 없이
          # 앱 크레이트만 다시 빌드 → 번들 시간이 ~6분에서 ~2분대로 떨어진다.
          # 저장은 Cargo.lock/rustc가 바뀐 태그에서만 일어난다(세이브 비용은 dep 변경당 1회).
          prefix-key: v2-bundle

      # macos-26은 공식 arm64 label → aarch64 .dmg. Intel Mac 대상은 별도 매트릭스 필요.
      # APPLE_SIGNING_IDENTITY: '-' → ad-hoc 서명. 없으면 arm64 미서명 앱이 "손상됨"으로
      # 안 뜬다. 정식 배포는 Developer ID + 공증(APPLE_ID/APPLE_TEAM_ID 시크릿).
      # TAURI_SIGNING_*: updater 아티팩트(.sig) 서명. 개인키는 repo secret, 비번은 없음(빈 문자열).
      # 공개키는 tauri.conf.json plugins.updater.pubkey — 앱이 이걸로 서명을 검증한다.
      - name: Tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri --workspace @mono/desktop -- build

      # 번들 하위 디렉터리(dmg/·macos/·nsis/)가 플랫폼마다 달라 아티팩트 구조가 어긋난다.
      # 원하는 파일만 평평한 staging/으로 모아 올린다 — 다운로드 후 글롭이 단순해진다.
      # .dmg = 신규 설치용. updater 타깃: darwin-aarch64 → .app.tar.gz, windows-x86_64 → -setup.exe.
      # .sig는 latest.json 서명에만 쓰고 릴리스에는 첨부하지 않는다.
      - name: Stage release files
        shell: bash
        run: |
          mkdir staging
          find target/release/bundle -type f \( \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
          \) -exec cp {} staging/ \;
          ls -la staging

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-${{ matrix.os }}
          path: staging/
          if-no-files-found: error

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mono-*
          path: release-assets
          merge-multiple: true

      # tauri-plugin-updater가 조회하는 매니페스트. 플랫폼별 서명(.sig 내용) + 다운로드 URL을
      # 담는다. URL은 태그에 고정 — "latest" 플래그와 무관하게 항상 이 릴리스를 가리킨다.
      - name: Build latest.json
        env:
          VERSION: ${{ github.ref_name }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mac_archive="$(basename "$(ls release-assets/*.app.tar.gz)")"
          win_installer="$(basename "$(ls release-assets/*-setup.exe)")"
          mac_sig="$(cat release-assets/*.app.tar.gz.sig)"
          win_sig="$(cat release-assets/*-setup.exe.sig)"
          [[ -n "$mac_sig" && -n "$win_sig" ]] || { echo "서명 파일이 비어 있다 — TAURI_SIGNING_PRIVATE_KEY secret 확인." >&2; exit 1; }
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$mac_sig" --arg mac_url "$BASE_URL/$mac_archive" \
            --arg win_sig "$win_sig" --arg win_url "$BASE_URL/$win_installer" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > release-assets/latest.json
          cat release-assets/latest.json

      - name: Attach desktop bundles to draft release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/latest.json

  verify-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-draft-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Draft 릴리스는 tag가 없어 GET /releases/tags/{tag}가 404다. attach step이
      # 보고한 asset 목록(newly uploaded/overwritten)을 그대로 검증한다.
      - name: Verify Windows and macOS release assets
        env:
          ASSETS_JSON: ${{ needs.publish-draft-release.outputs.assets }}
        run: |
          printf '%s\n' "$ASSETS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "publish-draft-release가 asset을 보고하지 않았다." >&2; exit 1; }
          names="$(printf '%s' "$ASSETS_JSON" | jq -r '.[].name')"
          printf '%s\n' "$names"

          windows_count="$(printf '%s\n' "$names" | grep -Ec -- '-setup\.exe$' || true)"
          macos_count="$(printf '%s\n' "$names" | grep -Ec -- '\.dmg$' || true)"
          mac_updater_count="$(printf '%s\n' "$names" | grep -Ec -- '\.app\.tar\.gz$' || true)"
          manifest_count="$(printf '%s\n' "$names" | grep -Ec -- '^latest\.json$' || true)"
          if [[ "$windows_count" -ne 1 || "$macos_count" -ne 1 || "$mac_updater_count" -ne 1 || "$manifest_count" -ne 1 ]]; then
            echo "Windows setup exe·macOS DMG·macOS .app.tar.gz·latest.json 각 1개를 기대했다." >&2
            exit 1
          fi

  # bundle과 병렬로 돈다 — 서버 배포는 태그 SHA만 있으면 되고 번들 아티팩트와 무관하다.
  # 서버가 클라이언트보다 잠깐 앞서는 건 안전한 방향(앱은 서버가 뒤처질 때만 경고).
  # publish-release가 이 잡 완료를 기다리므로 "서버 배포·검증 후 클라이언트 공개" 순서는 유지된다.
  deploy-release-server:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
    steps:
      # Tailscale OIDC는 main ref만 신뢰한다. 태그가 가리키는 SHA와 main이 같을 때만
      # main 배포를 요청하고, 그 실행이 성공해야 릴리즈 공개를 허용한다.
      - name: Deploy same SHA from trusted main ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag $GITHUB_REF_NAME points to $GITHUB_SHA, but main is $main_sha." >&2
            exit 1
          fi

          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_name="Deploy server $GITHUB_SHA"
          gh workflow run deploy-server.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$GITHUB_SHA"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow deploy-server.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,headSha,displayTitle,createdAt \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .displayTitle == \"$run_name\" and .createdAt >= \"$requested_at\") | .databaseId" \
                | head -n 1
            )"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Dispatched server deployment run was not found." >&2
            exit 1
          fi

          echo "Waiting for server deployment run $run_id."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release-assets, deploy-release-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  prune-old-releases:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep latest five published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t stale_tags < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[5:] | .[].tagName'
          )

          for tag in "${stale_tags[@]}"; do
            [[ -n "$tag" ]] || continue
            echo "Deleting old release $tag; Git tag remains."
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
