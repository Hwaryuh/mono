name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # 임베드 API 서버(axum + rusqlite). tauri build 전체는 아이콘/서명 설정이 정리되면 추가.
      - name: API server tests
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: API server release build
        run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml
