name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 빠른 검증 — 모든 push/PR/태그. 프론트 + 임베드 API 서버 유닛 테스트.
  # macOS 러너는 청구 10배라 제외 — 유닛 테스트는 플랫폼 무관, 실제 macOS 빌드는 태그의 bundle 잡이 한다.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # v1: check 프로필 dep 아티팩트를 캐시에 새로 태우려고 한 번 bump.
          # 이전 캐시는 release 빌드 기준이라 cargo check가 매번 dep를 새로 컴파일했다.
          prefix-key: v1-rust

      - name: API server tests
        run: cargo test --lib -p mono-api

      # 매 push의 컴파일 검증만. 진짜 release 빌드(LTO+codegen-units=1)는 태그 걸린 bundle 잡이 함.
      - name: Workspace compile check
        run: cargo check --workspace

  # 전체 번들 — v* 태그·수동 실행만. 일반 push에서는 안 돎(macOS 러너 분 아낌).
  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # 컴파일 결과는 sccache가 파일 단위로 재사용한다. target 전체를 압축·업로드하면
          # macOS에서 캐시 저장만 약 2분 걸리므로 레지스트리 캐시만 유지한다.
          cache-targets: false

      - name: Set up Rust compiler cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # macos-26은 공식 arm64 label → aarch64 .dmg. Intel Mac 대상은 별도 매트릭스 필요.
      # APPLE_SIGNING_IDENTITY: '-' → ad-hoc 서명. 없으면 arm64 미서명 앱이 "손상됨"으로
      # 안 뜬다. 정식 배포는 Developer ID + 공증(APPLE_ID/APPLE_TEAM_ID 시크릿).
      # TAURI_SIGNING_*: updater 아티팩트(.sig) 서명. 개인키는 repo secret, 비번은 없음(빈 문자열).
      # 공개키는 tauri.conf.json plugins.updater.pubkey — 앱이 이걸로 서명을 검증한다.
      - name: Tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri --workspace @mono/desktop -- build

      # 번들 하위 디렉터리(dmg/·macos/·nsis/)가 플랫폼마다 달라 아티팩트 구조가 어긋난다.
      # 원하는 파일만 평평한 staging/으로 모아 올린다 — 다운로드 후 글롭이 단순해진다.
      # .dmg = 신규 설치용. updater 타깃: darwin-aarch64 → .app.tar.gz, windows-x86_64 → -setup.exe.
      # .sig는 latest.json 서명에만 쓰고 릴리스에는 첨부하지 않는다.
      - name: Stage release files
        shell: bash
        run: |
          mkdir staging
          find target/release/bundle -type f \( \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
          \) -exec cp {} staging/ \;
          ls -la staging

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-${{ matrix.os }}
          path: staging/
          if-no-files-found: error

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mono-*
          path: release-assets
          merge-multiple: true

      # tauri-plugin-updater가 조회하는 매니페스트. 플랫폼별 서명(.sig 내용) + 다운로드 URL을
      # 담는다. URL은 태그에 고정 — "latest" 플래그와 무관하게 항상 이 릴리스를 가리킨다.
      - name: Build latest.json
        env:
          VERSION: ${{ github.ref_name }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mac_archive="$(basename "$(ls release-assets/*.app.tar.gz)")"
          win_installer="$(basename "$(ls release-assets/*-setup.exe)")"
          mac_sig="$(cat release-assets/*.app.tar.gz.sig)"
          win_sig="$(cat release-assets/*-setup.exe.sig)"
          [[ -n "$mac_sig" && -n "$win_sig" ]] || { echo "서명 파일이 비어 있다 — TAURI_SIGNING_PRIVATE_KEY secret 확인." >&2; exit 1; }
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$mac_sig" --arg mac_url "$BASE_URL/$mac_archive" \
            --arg win_sig "$win_sig" --arg win_url "$BASE_URL/$win_installer" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > release-assets/latest.json
          cat release-assets/latest.json

      - name: Attach desktop bundles to draft release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*.dmg
            release-assets/*.app.tar.gz
            release-assets/latest.json

  verify-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-draft-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Draft 릴리스는 tag가 없어 GET /releases/tags/{tag}가 404다. attach step이
      # 보고한 asset 목록(newly uploaded/overwritten)을 그대로 검증한다.
      - name: Verify Windows and macOS release assets
        env:
          ASSETS_JSON: ${{ needs.publish-draft-release.outputs.assets }}
        run: |
          printf '%s\n' "$ASSETS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "publish-draft-release가 asset을 보고하지 않았다." >&2; exit 1; }
          names="$(printf '%s' "$ASSETS_JSON" | jq -r '.[].name')"
          printf '%s\n' "$names"

          windows_count="$(printf '%s\n' "$names" | grep -Ec -- '-setup\.exe$' || true)"
          macos_count="$(printf '%s\n' "$names" | grep -Ec -- '\.dmg$' || true)"
          mac_updater_count="$(printf '%s\n' "$names" | grep -Ec -- '\.app\.tar\.gz$' || true)"
          manifest_count="$(printf '%s\n' "$names" | grep -Ec -- '^latest\.json$' || true)"
          if [[ "$windows_count" -ne 1 || "$macos_count" -ne 1 || "$mac_updater_count" -ne 1 || "$manifest_count" -ne 1 ]]; then
            echo "Windows setup exe·macOS DMG·macOS .app.tar.gz·latest.json 각 1개를 기대했다." >&2
            exit 1
          fi
