name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 빠른 검증 — 모든 push/PR/태그. 프론트 + 임베드 API 서버 유닛 테스트.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # v1: check 프로필 dep 아티팩트를 캐시에 새로 태우려고 한 번 bump.
          # 이전 캐시는 release 빌드 기준이라 cargo check가 매번 dep를 새로 컴파일했다.
          prefix-key: v1-rust

      - name: API server tests
        run: cargo test --lib -p mono-api

      # 매 push의 컴파일 검증만. 진짜 release 빌드(LTO+codegen-units=1)는 태그 걸린 bundle 잡이 함.
      - name: Workspace compile check
        run: cargo check --workspace

  # 전체 번들 — v* 태그·수동 실행만. 일반 push에서는 안 돎(macOS 러너 분 아낌).
  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            release_asset: target/release/bundle/nsis/*-setup.exe
          - os: macos-26
            release_asset: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # macos-26은 공식 arm64 label → aarch64 .dmg. Intel Mac 대상은 별도 매트릭스 필요.
      # APPLE_SIGNING_IDENTITY: '-' → ad-hoc 서명. 없으면 arm64 미서명 앱이 "손상됨"으로
      # 안 뜬다. 정식 배포는 Developer ID + 공증(APPLE_ID/APPLE_TEAM_ID 시크릿).
      - name: Tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri --workspace @mono/desktop -- build

      # .app은 zip으로 압축하면 심볼릭 링크·실행 권한이 깨진다 — .dmg만 올린다(mac 배포 형식).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-${{ matrix.os }}
          path: ${{ matrix.release_asset }}
          if-no-files-found: error

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mono-*
          path: release-assets
          merge-multiple: true

      - name: Attach desktop bundles to draft release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*.dmg

  verify-release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-draft-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Draft 릴리스는 tag가 없어 GET /releases/tags/{tag}가 404다. attach step이
      # 보고한 asset 목록(newly uploaded/overwritten)을 그대로 검증한다.
      - name: Verify Windows and macOS release assets
        env:
          ASSETS_JSON: ${{ needs.publish-draft-release.outputs.assets }}
        run: |
          printf '%s\n' "$ASSETS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "publish-draft-release가 asset을 보고하지 않았다." >&2; exit 1; }
          names="$(printf '%s' "$ASSETS_JSON" | jq -r '.[].name')"
          printf '%s\n' "$names"

          windows_count="$(printf '%s\n' "$names" | grep -Ec -- '-setup\.exe$' || true)"
          macos_count="$(printf '%s\n' "$names" | grep -Ec -- '\.dmg$' || true)"
          if [[ "$windows_count" -ne 1 || "$macos_count" -ne 1 ]]; then
            echo "Windows setup exe 1개와 macOS DMG 1개를 기대했다." >&2
            exit 1
          fi
